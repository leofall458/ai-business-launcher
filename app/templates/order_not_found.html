<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Not Found - Launch Bridge LLC</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen py-12">
    <div class="max-w-md mx-auto px-4 sm:px-8 space-y-6">

        <div class="text-center mb-2">
            <p class="text-blue-400 text-xs sm:text-sm font-semibold tracking-widest uppercase mb-3">Launch Bridge LLC</p>
            <h1 class="text-2xl font-bold mb-2">Order Not Found</h1>
            <p class="text-gray-400 text-sm">Order not found. Check your ID or request it below.</p>
        </div>

        <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 sm:p-6">
            <h2 class="text-sm font-semibold text-white mb-3">Request Your Order ID by Email</h2>
            <form hx-post="/request-order-id" hx-target="#result" hx-swap="innerHTML" class="flex gap-2">
                <input name="email" type="email" required placeholder="Enter your email address"
                    class="flex-1 bg-gray-800 rounded-lg p-3 text-white placeholder-gray-500 border border-gray-700 focus:border-blue-500 focus:outline-none text-sm"/>
                <button type="submit"
                    class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 rounded-lg transition text-sm whitespace-nowrap">
                    Send My Order ID
                </button>
            </form>
            <div id="result" class="mt-1"></div>
        </div>

        <p class="text-center">
            <a href="/" class="text-blue-400 text-sm underline">← Back to homepage</a>
        </p>

        <div class="text-center mt-8 pt-6 border-t border-gray-800">
            <p class="text-xs text-gray-600">© 2026 Launch Bridge LLC ·
                <a href="/terms" class="text-gray-500 hover:text-gray-400">Terms</a> ·
                <a href="/privacy" class="text-gray-500 hover:text-gray-400">Privacy</a> ·
                <a href="mailto:support@launchbridge.ai" class="text-gray-500 hover:text-gray-400">support@launchbridge.ai</a>
            </p>
            <p class="text-xs text-gray-700 mt-1">Launch Bridge LLC is a document preparation service, not a law firm.</p>
        </div>

    </div>
</body>
</html>
