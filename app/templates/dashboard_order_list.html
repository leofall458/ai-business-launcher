<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Orders - Launch Bridge LLC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% include "_ga4.html" %}
</head>
<body class="bg-gray-950 text-white min-h-screen py-8 sm:py-12">
    <div class="max-w-2xl mx-auto px-4 sm:px-8 space-y-6">
        <div class="text-center mb-2">
            <p class="text-blue-400 text-xs sm:text-sm font-semibold tracking-widest uppercase mb-3">Launch Bridge LLC</p>
            <h1 class="text-2xl sm:text-3xl font-bold">Your Orders</h1>
        </div>

        {% if orders %}
        <div class="space-y-3">
            {% for order in orders %}
            <a href="/dashboard/orders/{{ order.order_id }}"
                class="block bg-gray-900 border border-gray-800 rounded-xl p-5 hover:border-blue-600 transition">
                <p class="font-semibold">{{ order.business_name or "Untitled Order" }}</p>
            </a>
            {% endfor %}
        </div>
        {% else %}
        <p class="text-gray-400 text-center">No orders found for this account.</p>
        {% endif %}

        <p class="text-xs text-gray-600 text-center pt-4">
            <a href="/dashboard/logout" class="text-gray-500 hover:text-gray-400 underline">Sign out</a>
        </p>
    </div>
</body>
</html>
