<div id="regenerate-area-{{ order_id }}">
    <form hx-post="/admin/{{ order_id }}/regenerate-website"
          hx-target="#regenerate-area-{{ order_id }}" hx-swap="outerHTML"
          hx-indicator="#regenerate-loading-{{ order_id }}">
        <button type="submit"
            class="bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
            🔄 Regenerate Website
        </button>
    </form>
    <div id="regenerate-loading-{{ order_id }}" class="htmx-indicator items-center gap-2 text-sm text-[#0e2148]/50 mt-2">
        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span>🔄 Regenerating website...</span>
    </div>
</div>
