<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Launch Bridge LLC</title>
    {% include "_brand.html" %}
    {% include "_ga4.html" %}
</head>
<body class="bg-[#FAF8F3] text-[#0e2148] min-h-screen flex items-center justify-center py-12">
    <div class="max-w-md w-full mx-auto px-6 space-y-6">
        <div class="text-center mb-2">
            <div class="eyebrow justify-center mb-4">Launch Bridge LLC</div>
            <h1 class="font-serif text-2xl sm:text-3xl font-bold text-[#0e2148] mb-2">Sign In to Your Dashboard</h1>
            <p class="text-[#0e2148]/55 text-sm">Enter the email you used to place your order and we'll send you a one-time sign-in link.</p>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 rounded-xl p-4 text-sm text-red-700">{{ error }}</div>
        {% endif %}

        <form method="post" action="/dashboard/login" class="space-y-3">
            <div>
                <label class="block text-xs text-[#0e2148]/50 font-medium mb-1">Email</label>
                <input name="email" type="email" required autofocus
                    class="w-full bg-white border border-[#0e2148]/20 rounded-lg p-3 text-[#0e2148] placeholder-[#0e2148]/30 focus:border-[#c9a227] focus:outline-none text-sm transition"/>
            </div>
            <button type="submit"
                class="w-full bg-[#c9a227] hover:bg-[#b8860b] text-[#0e2148] font-bold py-3 rounded-full transition text-sm shadow-md shadow-[#c9a227]/25">
                Send Sign-In Link
            </button>
        </form>

        <p class="text-xs text-[#0e2148]/35 text-center">
            Questions? Email <a href="mailto:support@launchbridge.ai" class="text-[#c9a227] underline">support@launchbridge.ai</a>
        </p>
    </div>
</body>
</html>
