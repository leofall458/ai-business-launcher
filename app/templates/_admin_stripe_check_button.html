<div id="stripe-check-area-{{ order_id }}">
    <form hx-post="/admin/{{ order_id }}/check-stripe-status"
          hx-target="#stripe-check-area-{{ order_id }}" hx-swap="outerHTML"
          hx-indicator="#stripe-check-loading-{{ order_id }}">
        <button type="submit"
            class="bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-semibold px-4 py-2 rounded-lg transition">
            💳 Check Stripe Status
        </button>
    </form>
    <div id="stripe-check-loading-{{ order_id }}" class="htmx-indicator items-center gap-2 text-sm text-[#0e2148]/50 mt-2">
        <svg class="animate-spin h-4 w-4" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
        </svg>
        <span>💳 Checking Stripe status...</span>
    </div>
</div>
