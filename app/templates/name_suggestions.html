{% if names %}
<div class="mt-3">
    <p class="text-xs text-gray-400 font-medium mb-2">Try one of these available names:</p>
    <div class="flex flex-wrap">
        {% for name in names %}
        <span class="name-chip" onclick="tryAlternativeName({{ name | tojson }})">{{ name }}</span>
        {% endfor %}
    </div>
</div>
{% endif %}
