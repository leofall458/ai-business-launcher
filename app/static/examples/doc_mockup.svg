<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <defs>
    <filter id="blur-light">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2"/>
    </filter>
    <filter id="blur-med">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5"/>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="rgba(0,0,0,0.13)"/>
    </filter>
  </defs>

  <!-- ── PAGE 3 (back) — EIN Letter ── -->
  <g transform="rotate(-6, 240, 170)" filter="url(#shadow)">
    <rect x="140" y="30" width="240" height="310" rx="4" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1"/>
    <!-- IRS header -->
    <rect x="140" y="30" width="240" height="36" rx="4" fill="#7C3AED" opacity=".85"/>
    <rect x="140" y="54" width="240" height="12" fill="#7C3AED" opacity=".85"/>
    <text x="260" y="53" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">EIN CONFIRMATION</text>
    <!-- Blurred body -->
    <g filter="url(#blur-med)">
      <rect x="156" y="82" width="160" height="7" rx="3" fill="#374151" opacity=".5"/>
      <rect x="156" y="96" width="140" height="7" rx="3" fill="#374151" opacity=".4"/>
      <rect x="156" y="110" width="180" height="7" rx="3" fill="#374151" opacity=".35"/>
      <rect x="156" y="136" width="80" height="14" rx="3" fill="#1D4ED8" opacity=".6"/>
      <rect x="156" y="158" width="200" height="6" rx="3" fill="#374151" opacity=".3"/>
      <rect x="156" y="170" width="176" height="6" rx="3" fill="#374151" opacity=".3"/>
      <rect x="156" y="182" width="190" height="6" rx="3" fill="#374151" opacity=".3"/>
      <rect x="156" y="210" width="160" height="6" rx="3" fill="#374151" opacity=".25"/>
      <rect x="156" y="222" width="140" height="6" rx="3" fill="#374151" opacity=".25"/>
      <rect x="156" y="250" width="120" height="8" rx="3" fill="#374151" opacity=".4"/>
      <rect x="156" y="264" width="100" height="8" rx="3" fill="#374151" opacity=".3"/>
    </g>
  </g>

  <!-- ── PAGE 2 (middle) — Operating Agreement ── -->
  <g transform="rotate(3, 240, 170)" filter="url(#shadow)">
    <rect x="80" y="15" width="240" height="310" rx="4" fill="white" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Header bar -->
    <rect x="80" y="15" width="240" height="36" rx="4" fill="#1B4332" opacity=".9"/>
    <rect x="80" y="39" width="240" height="12" fill="#1B4332" opacity=".9"/>
    <text x="200" y="38" font-family="'Segoe UI', sans-serif" font-size="8.5" font-weight="700" fill="white" text-anchor="middle">OPERATING AGREEMENT</text>
    <!-- Blurred body -->
    <g filter="url(#blur-light)">
      <rect x="96" y="72" width="200" height="7" rx="3" fill="#374151" opacity=".5"/>
      <rect x="96" y="86" width="180" height="7" rx="3" fill="#374151" opacity=".45"/>
      <rect x="96" y="100" width="196" height="7" rx="3" fill="#374151" opacity=".4"/>
      <rect x="96" y="122" width="140" height="7" rx="3" fill="#374151" opacity=".5"/>
      <rect x="96" y="136" width="196" height="6" rx="3" fill="#374151" opacity=".35"/>
      <rect x="96" y="148" width="176" height="6" rx="3" fill="#374151" opacity=".35"/>
      <rect x="96" y="160" width="190" height="6" rx="3" fill="#374151" opacity=".35"/>
      <rect x="96" y="172" width="160" height="6" rx="3" fill="#374151" opacity=".3"/>
      <rect x="96" y="196" width="130" height="7" rx="3" fill="#374151" opacity=".5"/>
      <rect x="96" y="210" width="196" height="6" rx="3" fill="#374151" opacity=".3"/>
      <rect x="96" y="222" width="180" height="6" rx="3" fill="#374151" opacity=".3"/>
      <rect x="96" y="234" width="166" height="6" rx="3" fill="#374151" opacity=".3"/>
      <rect x="96" y="268" width="80" height="7" rx="3" fill="#374151" opacity=".4"/>
      <rect x="96" y="282" width="130" height="6" rx="3" fill="#374151" opacity=".35"/>
    </g>
  </g>

  <!-- ── PAGE 1 (front) — Articles of Organization ── -->
  <g filter="url(#shadow)">
    <rect x="20" y="0" width="240" height="310" rx="4" fill="white" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Virginia SCC header -->
    <rect x="20" y="0" width="240" height="48" rx="4" fill="#1A3A5C"/>
    <rect x="20" y="36" width="240" height="12" fill="#1A3A5C"/>
    <text x="140" y="24" font-family="'Segoe UI', sans-serif" font-size="8" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="1">COMMONWEALTH OF VIRGINIA</text>
    <text x="140" y="40" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="white" text-anchor="middle">STATE CORPORATION COMMISSION</text>
    <!-- Document title -->
    <text x="140" y="74" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#1A3A5C" text-anchor="middle">Articles of Organization</text>
    <text x="140" y="86" font-family="'Segoe UI', sans-serif" font-size="8.5" fill="#6B7280" text-anchor="middle">Limited Liability Company</text>
    <line x1="36" y1="92" x2="244" y2="92" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Blurred content — less blurred so structure is visible -->
    <g filter="url(#blur-light)">
      <rect x="36" y="104" width="80" height="6" rx="2" fill="#374151" opacity=".6"/>
      <rect x="36" y="116" width="190" height="7" rx="2" fill="#1A3A5C" opacity=".7"/>
      <rect x="36" y="132" width="70" height="6" rx="2" fill="#374151" opacity=".5"/>
      <rect x="36" y="144" width="180" height="7" rx="2" fill="#374151" opacity=".55"/>
      <rect x="36" y="160" width="80" height="6" rx="2" fill="#374151" opacity=".5"/>
      <rect x="36" y="172" width="190" height="6" rx="2" fill="#374151" opacity=".45"/>
      <rect x="36" y="184" width="170" height="6" rx="2" fill="#374151" opacity=".4"/>
      <rect x="36" y="204" width="90" height="6" rx="2" fill="#374151" opacity=".5"/>
      <rect x="36" y="216" width="180" height="6" rx="2" fill="#374151" opacity=".4"/>
      <rect x="36" y="228" width="160" height="6" rx="2" fill="#374151" opacity=".4"/>
      <rect x="36" y="248" width="70" height="6" rx="2" fill="#374151" opacity=".5"/>
      <rect x="36" y="260" width="140" height="6" rx="2" fill="#374151" opacity=".4"/>
    </g>
    <!-- Approved stamp -->
    <g transform="translate(156, 268)">
      <rect width="80" height="28" rx="4" fill="none" stroke="#16A34A" stroke-width="1.5" opacity=".7"/>
      <text x="40" y="12" font-family="'Segoe UI', sans-serif" font-size="7.5" font-weight="800" fill="#16A34A" text-anchor="middle" opacity=".9" letter-spacing=".5">✓ APPROVED</text>
      <text x="40" y="22" font-family="'Segoe UI', sans-serif" font-size="7" fill="#16A34A" text-anchor="middle" opacity=".7">Virginia SCC</text>
    </g>
    <!-- SCC seal placeholder -->
    <circle cx="56" cy="282" r="20" fill="none" stroke="#1A3A5C" stroke-width="1" opacity=".15"/>
    <circle cx="56" cy="282" r="15" fill="none" stroke="#1A3A5C" stroke-width="0.5" opacity=".1"/>
    <text x="56" y="286" font-family="serif" font-size="8" fill="#1A3A5C" text-anchor="middle" opacity=".25">SCC</text>
  </g>

</svg>
